url: https://isglobal-brge.github.io/dsVertClient/
template:
  bootstrap: 5

footer:
  structure:
    left: package
    right: built_with

navbar:
  structure:
    left: [reference, news]
    right: [search, github]

reference:
- title: Public frontdoor API
  contents:
  - ds.vert.aliases
- title: PSI alignment and identity
  contents:
  - ds.psiAlign
  - ds.isPsiAligned
  - ds.getIdentityPks
- title: DP policy, security and numeric contracts
  contents:
  - ds.vertMethodStatus
  - ds.vertSecurityStatus
  - ds.vertNumericPreflight
  - ds.validateDPGaussianCertificate
- title: Canonical sticky Count
  contents:
  - ds.vertDPCount
- title: Sticky differentially private biomedical capsule
  contents:
  - starts_with("ds.vertDP")
  - "-ds.vertDPCount"
- title: Epidemiology from authorised inputs
  contents:
  - ds.vertEpi2x2
  - ds.vertMantelHaenszel
  - ds.vertDirectStandardization
  - ds.vertIndirectStandardization
- title: Conditional and compatibility analyses
  contents:
  - ds.vertDesc
  - ds.vertCor
  - ds.vertPCA
  - ds.vertChisq
  - ds.vertChisqCross
  - ds.vertFisher
  - ds.vertGLM
  - ds.vertLASSO
  - ds.vertLASSOProximal
  - ds.vertLASSO1Step
  - ds.vertLASSOCV
  - ds.vertLR
  - ds.vertConfint
  - ds.vertWald
  - ds.vertContrast
- title: Quarantined compatibility frontdoors
  desc: Retained public names that fail locally before DSI; consult ds.vertMethodStatus().
  contents:
  - ds.vertCox
  - ds.vertCoxProfileNonDisclosive
  - ds.vertCoxDiscreteNonDisclosive
  - ds.vertNBFullRegTheta
  - ds.vertMultinom
  - ds.vertMultinomJoint
  - ds.vertMultinomJointNewton
  - ds.vertOrdinal
  - ds.vertOrdinalJointNewton
  - ds.vertLMM
  - ds.vertLMM.k3
  - ds.vertGEE
  - ds.vertGLMM
  - ds.vertIPW
  - ds.vertMI
  - ds.vertLASSOIter
- title: Helpers and S3 methods
  contents:
  - k2-beaver-lbfgs-client
  - k3-ring63-dcf-loop
  - starts_with("chunk")
  - starts_with("coef.")
  - starts_with("print.")
  - starts_with("summary.")

